<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Skills | Ayman Ibrahim</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="../assets/style.css" />
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Page-only styling for a modern Skills layout -->
  <style>
    .section-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 10px 20px 60px;
    }

    .headline {
      text-align: center;
      margin: 0 auto 30px;
      max-width: 820px;
      color: #94a3b8;
      font-size: 1.05rem;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }
    @media (max-width: 900px) {
      .skills-grid { grid-template-columns: 1fr; }
    }

    .skill-card {
      background: #020617;
      border-radius: 14px;
      padding: 26px;
      border: 1px solid rgba(148,163,184,0.08);
      position: relative;
      overflow: hidden;
    }

    .skill-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(56,189,248,0.14), transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(16,185,129,0.10), transparent 48%);
      pointer-events: none;
    }

    .skill-top {
      position: relative;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .icon-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: rgba(56,189,248,0.10);
      border: 1px solid rgba(56,189,248,0.18);
      color: #38bdf8;
      flex: 0 0 auto;
    }

    .skill-title {
      position: relative;
      margin: 0;
      font-size: 1.15rem;
      font-weight: 800;
    }

    .skill-sub {
      position: relative;
      margin-top: 6px;
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .tags {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(56,189,248,0.08);
      border: 1px solid rgba(56,189,248,0.14);
      color: #cbd5e1;
      font-size: 13px;
      white-space: nowrap;
    }

    .tag strong { color: #e5e7eb; font-weight: 700; }

    .mini-note {
      position: relative;
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(2,6,23,0.55);
      border: 1px solid rgba(148,163,184,0.10);
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .capabilities {
      margin-top: 26px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    @media (max-width: 900px) {
      .capabilities { grid-template-columns: 1fr; }
    }

    .cap {
      background: rgba(2,6,23,0.75);
      border: 1px solid rgba(148,163,184,0.10);
      border-radius: 14px;
      padding: 18px;
      color: #cbd5e1;
    }

    .cap h3 {
      margin-bottom: 8px;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #e5e7eb;
    }

    .cap p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin: 0;
    }
  </style>
</head>
